# Home Assistant's ingress in front of the admin UI. Only the Supervisor (172.30.32.2) may
# connect, as the developer docs require; it has signed the user in and sets
# X-Remote-User-Name, -Id, -Display-Name and -Groups itself (dropping what the browser sent).
# They go on to the admin UI from 127.0.0.1, its one trusted proxy (ADMIN_TRUSTED_PROXIES).
#
# The admin UI's pages link to absolute paths (/users/..., /static/...): under the ingress they
# live below X-Ingress-Path (/api/hassio_ingress/<token>), which HA Core sets on every request.
# Links, forms and redirects are rewritten here.
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;
user www-data;

events {
    worker_connections 128;
}

http {
    access_log off;
    server_tokens off;
    client_max_body_size 1m;
    proxy_temp_path /tmp/nginx-proxy;
    client_body_temp_path /tmp/nginx-body;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # the ingress path, only as HA Core writes it: anything else is no ingress request
    map $http_x_ingress_path $ingress_path {
        "~^/api/hassio_ingress/[A-Za-z0-9_-]+$" $http_x_ingress_path;
        default "";
    }

    server {
        listen 8099 default_server;
        allow 172.30.32.2;
        deny all;

        location / {
            if ($ingress_path = "") {
                return 400;
            }
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            # the forms check that they are posted from the same site: the browser's Host
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            # the identity of the Supervisor's request, as it is (it replaced the browser's)
            proxy_set_header X-Remote-User-Name $http_x_remote_user_name;
            proxy_set_header X-Remote-User-Groups $http_x_remote_user_groups;
            # plain text to rewrite
            proxy_set_header Accept-Encoding "";
            proxy_redirect ~^/(.*)$ $ingress_path/$1;
            sub_filter_once off;
            sub_filter_types text/css;
            sub_filter 'href="/' 'href="$ingress_path/';
            sub_filter 'src="/' 'src="$ingress_path/';
            sub_filter 'action="/' 'action="$ingress_path/';
            sub_filter 'url(/' 'url($ingress_path/';
        }
    }
}
