name: Build app

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      publish:
        required: true
        type: boolean

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Get app information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ inputs.app }}"

      - name: Normalize app information
        id: normalize
        env:
          IMAGE: ${{ steps.info.outputs.image }}
          VERSION: ${{ steps.info.outputs.version }}
          NAME: ${{ steps.info.outputs.name }}
          DESCRIPTION: ${{ steps.info.outputs.description }}
          URL: ${{ steps.info.outputs.url }}
        run: |
          # the info helper gives its values as JSON strings ("ghcr.io/...", "0.1.0"): without the
          # quotes, or the image's reference is invalid ("..."):"...")
          unquote() { local v=${1#\"}; printf '%s' "${v%\"}"; }
          IMAGE=$(unquote "${IMAGE}") VERSION=$(unquote "${VERSION}") NAME=$(unquote "${NAME}")
          DESCRIPTION=$(unquote "${DESCRIPTION}") URL=$(unquote "${URL}")
          {
            echo "image_name=${IMAGE##*/}"
            echo "registry_prefix=${IMAGE%/*}"
            echo "version=${VERSION}"
            echo "name=${NAME}"
            echo "description=${DESCRIPTION}"
            if [[ -n "${URL}" && "${URL}" != "null" ]]; then
              echo "url=${URL}"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # the accounts' base image is about 5 GB: room on the runner first
      - name: Free disk space
        if: inputs.app == 'firefox_accounts'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./${{ inputs.app }}"
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          # the firefox-sync images: the Dockerfiles' default (the public repository), or the
          # repository variable FIREFOX_SYNC_IMAGES (ghcr.io/porelli/firefox-sync-dev to test
          # with the dev images; then nothing is published, see builder.yml). Not airconnect's
          build-args: ${{ startsWith(inputs.app, 'firefox_') && vars.FIREFOX_SYNC_IMAGES && format('IMAGE_REPOSITORY={0}', vars.FIREFOX_SYNC_IMAGES) || '' }}
          push: ${{ inputs.publish }}
          # a published version is never pushed again: bump `version` to release a change
          skip-existing: ${{ needs.prepare.outputs.version }}
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
          skip-existing: ${{ needs.prepare.outputs.version }}
