name: Builder

# The add-ons with a Dockerfile of their own, built with Home Assistant's builder actions
# (BuildKit, one runner per architecture, a multi-arch manifest), as home-assistant/apps-example
# does since the legacy builder was retired (developers.home-assistant.io/blog/2026/04/02/builder-migration).
# Pushed to ghcr.io on main only. The Firefox Sync add-ons only when built from the public
# firefox-sync images: with the repository variable FIREFOX_SYNC_IMAGES set (the dev images) they
# build without pushing. airconnect: from the AirConnect release binaries (its Dockerfile).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-app:
    name: Build ${{ matrix.app }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - airconnect
          - firefox_sync
          - firefox_accounts
    uses: ./.github/workflows/build-app.yml
    with:
      app: ${{ matrix.app }}
      publish: ${{ github.event_name == 'push' && (matrix.app == 'airconnect' || vars.FIREFOX_SYNC_IMAGES == '') }}
    secrets: inherit
