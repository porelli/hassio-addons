name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "*/Dockerfile"
          recursive: true

  app-linter:
    name: Lint app ${{ matrix.path }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - airconnect
          - firefox_sync
          - firefox_accounts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # the app linter (formerly frenck/action-addon-linter): config.yaml against the
      # Supervisor's schema, and the options left at their default
      - name: Run Home Assistant App Lint
        uses: frenck/action-app-linter@v2.21.2
        with:
          path: "./${{ matrix.path }}"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Run ShellCheck on the add-ons' scripts and the tests
        run: |
          # (seam/: firefox-sync's files, linted there)
          grep -rlE '^#!.*(bash|bashio|/sh)' firefox_*/rootfs tests | grep -v '\.py$' | grep -v '/seam/' |
            xargs shellcheck -x -S warning -s bash

  validate:
    name: Validate the repository and the apps' files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # repository.yaml: the Supervisor does not load the repository without a valid one
      - name: Validate repository.yaml, the YAML and JSON files
        run: |
          set -e
          test "$(yq -r '.name' repository.yaml)" != null
          for f in repository.yaml */config.yaml */translations/*.yaml; do
            echo "Validating $f"
            yq -e 'true' "$f" > /dev/null
          done
          for f in */config.json; do
            echo "Validating $f"
            jq empty "$f"
          done
