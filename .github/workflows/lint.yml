name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "*/Dockerfile"
          recursive: true

  addon-linter:
    name: Lint app ${{ matrix.path }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - airconnect
          - firefox_sync
          - firefox_accounts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Home Assistant App Lint
        uses: frenck/action-addon-linter@v2.21
        with:
          path: "./${{ matrix.path }}"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck on the add-ons' scripts and the tests
        run: |
          # (seam/: firefox-sync's files, linted there)
          grep -rlE '^#!.*(bash|bashio|/sh)' firefox_*/rootfs tests | grep -v '\.py$' | grep -v '/seam/' |
            xargs shellcheck -x -S warning -s bash

  validate-json:
    name: Validate JSON files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate config.json files and repository.json
        run: |
          for config in */config.json repository.json; do
            echo "Validating $config"
            jq empty "$config"
          done
